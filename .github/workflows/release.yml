name: release

on:
  push:
    tags:
      - "v*"
    branches:
      - dev
    paths:
      - ".github/workflows/release.yml"
  # Manual run: builds and verifies the signed release APK without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
      - name: Check and assemble release
        run: ./gradlew check assembleRelease
      - name: Verify signature
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
      - name: Prepare release files
        if: github.ref_type == 'tag'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/*.apk "cidget-${VERSION}.apk"
          sha256sum "cidget-${VERSION}.apk" > "cidget-${VERSION}.apk.sha256"
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "cidget-${VERSION}.apk" "cidget-${VERSION}.apk.sha256" \
            --generate-notes
